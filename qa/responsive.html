<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Responsive Prüfung</title><style>body{margin:12px;background:#111827;color:white;font:16px system-ui}label,button{margin:8px}select,button{padding:10px}iframe{display:block;border:2px solid #475569;background:#101827;max-width:none;margin-top:12px}p{max-width:900px}</style><h1>Responsive Prüfung</h1><p>Browserprüfung der unveränderten Spielseite in festen Viewports. Dies simuliert Bildschirmgrößen; echte iOS-Tastatur und Safari-Verhalten müssen zusätzlich am Gerät geprüft werden.</p><label>Viewport <select id="size"><option value="390,844">iPhone Hochformat 390 × 844</option><option value="844,390">iPhone Querformat 844 × 390</option><option value="820,1180">iPad Hochformat 820 × 1180</option><option value="1180,820">iPad Querformat 1180 × 820</option></select></label><button id="reset">Seite neu laden</button><iframe id="gamePreview" title="Spielseite im gewählten Viewport" src="../index.html"></iframe><script>const frame=document.querySelector('iframe'),size=document.querySelector('select');function resize(){const [w,h]=size.value.split(',');frame.width=w;frame.height=h}size.addEventListener('change',resize);document.querySelector('button').addEventListener('click',()=>frame.src='../index.html?v='+Date.now());resize()</script></html>
