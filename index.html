<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MORE / LESS Online Test</title><style>
body{font-family:system-ui;background:#090d17;color:#fff;max-width:760px;margin:auto;padding:20px}.preLobbyHidden{display:none!important}button,input{font:inherit;border-radius:12px;padding:13px;border:1px solid #39445f;background:#141c2c;color:#fff}button{cursor:pointer;font-weight:800}.p{background:#7057ff}.box{background:#101725;border:1px solid #29344d;border-radius:18px;padding:16px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.hide{display:none}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{min-height:160px}.muted{color:#aeb8cc}.ok{color:#7dffa2}.err{color:#ff8d8d}h1{margin-bottom:4px}.overlay{position:fixed;inset:0;background:rgba(3,7,15,.78);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.overlay.hide{display:none}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:linear-gradient(145deg,#101a2d,#0c1424);border:1px solid #33425f;border-radius:24px;padding:22px;box-shadow:0 28px 80px #000b}.modalHead{display:flex;justify-content:space-between;align-items:flex-start}.modal h2{margin:0;font-size:30px}.close{border-radius:50%;width:44px;height:44px;padding:0}.codeBox{text-align:center;border:1px solid #33425f;border-radius:18px;padding:16px;margin:18px 0}.bigCode{font-size:34px;font-weight:900;letter-spacing:5px}.playerHead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:18px 0 10px}.playerList{display:grid;gap:8px}.playerRow{display:flex;align-items:center;gap:12px;background:#111c30;border:1px solid #263550;border-radius:14px;padding:12px}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#7057ff;font-weight:900}.grow{flex:1}.hostTag{font-size:12px;color:#9d8cff}.start{width:100%;margin-top:18px;font-size:18px}.waiting{opacity:.45}.tiny{font-size:13px}.copy{margin-left:10px;padding:8px 10px}.gameEnter{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#30256d 0,#0b1222 45%,#050810 100%);opacity:0;pointer-events:none;transition:opacity .28s}.gameEnter.on{opacity:1;pointer-events:auto}.gameEnterInner{text-align:center;transform:scale(.94);transition:transform .35s}.gameEnter.on .gameEnterInner{transform:scale(1)}.gameEnterLogo{font-size:clamp(38px,8vw,68px);font-weight:1000;letter-spacing:-3px}.gameEnterLogo span{color:#8f75ff}.gameEnterSub{margin-top:12px;color:#b8c2d8;font-weight:800}.gameEnterPulse{width:54px;height:54px;margin:22px auto 0;border:4px solid #ffffff25;border-top-color:#9b82ff;border-radius:50%;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.codeQrRow{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}.qrWrap{background:#fff;border-radius:14px;padding:8px;width:116px;height:116px;display:grid;place-items:center}.qrWrap canvas{width:100px;height:100px;display:block}.qrLabel{font-size:11px;color:#aeb8cc;margin-top:5px}</style></head><body>
<div id="gameEnter" class="gameEnter"><div class="gameEnterInner"><div class="gameEnterLogo">MORE <span>/</span> LESS</div><div class="gameEnterSub">Runde startet …</div><div class="gameEnterPulse"></div></div></div><h1>MORE / LESS 🌐</h1><div class="muted">Online-Test · getrennte Geräte · Supabase</div>
<div id="lobby" class="box"><input id="name" placeholder="Dein Name" maxlength="24"><div class="row" style="margin-top:10px"><button class="p" onclick="createRoom()">Raum erstellen</button><input id="code" placeholder="CODE" maxlength="8"><button onclick="joinRoom()">Beitreten</button></div><p id="status" class="muted">Bereit.</p><div id="room" class="hide"><h2 id="roomcode"></h2><div id="players"></div><div id="teams" class="row"></div><div id="host" class="hide"><button class="p" onclick="startQ(1)">MORE / LESS starten</button></div></div></div>
<div id="lobbyOverlay" class="overlay hide"><div class="modal"><div class="modalHead"><div><h2>👥 Lobby</h2><div class="muted">Warte auf weitere Spieler …</div></div><button class="close" onclick="closeLobby()">×</button></div><div class="codeBox"><div class="muted tiny">RAUMCODE</div><div class="codeQrRow"><div><div><span id="overlayCode" class="bigCode"></span><button class="copy" onclick="copyCode()">⧉</button></div><div class="muted tiny">Teile Code oder QR mit deinen Freunden.</div></div><div><div class="qrWrap"><canvas id="joinQr" width="200" height="200" aria-label="QR-Code zum Beitreten"></canvas></div><div class="qrLabel">Scannen & beitreten</div></div></div></div><div class="playerHead"><b id="playerCount">Spieler</b><span class="muted tiny">● Live-Lobby</span></div><div id="overlayPlayers" class="playerList"></div><div id="overlayHost" class="hide"><button id="overlayStart" class="p start" onclick="startQ(1)">▶ Spiel starten</button></div><button style="width:100%;margin-top:10px" onclick="closeLobby()">Lobby minimieren</button></div></div><div id="game" class="box preLobbyHidden"><div id="prog" class="muted"></div><h2 id="prompt"></h2><div class="cards"><button id="a" class="card" onclick="answer('a')"><b id="an"></b><br><span id="av"></span></button><button id="b" class="card" onclick="answer('b')"><b id="bn"></b><br><span id="bv">???</span></button></div><p id="reveal"></p><button id="next" class="p hide" onclick="startQ(S.q+1)">Nächste Frage</button></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
<script>
const SUPABASE_URL='https://rnwsbgzdrttqtivrwnxo.supabase.co',KEY='sb_publishable_-LR9193yunZTQxiFDWarGQ_rfwAU5sd';
const S={token:null,uid:null,room:null,code:null,host:false,q:0,t:null,myName:'',reconnecting:false,answeredQ:0,enteredGame:false,revealTrying:false,playerNames:{}};
const STORE='moreless_online_session_v1';
function saveSession(){try{localStorage.setItem(STORE,JSON.stringify({token:S.token,uid:S.uid,room:S.room,code:S.code,host:S.host,myName:S.myName}))}catch(e){}}
function clearSession(){try{localStorage.removeItem(STORE)}catch(e){}}
function loadSession(){try{return JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){return null}}
const el=id=>document.getElementById(id);
async function req(path,opt={}){let h={'apikey':KEY,'Content-Type':'application/json',...(S.token?{'Authorization':'Bearer '+S.token}:{})};let r=await fetch(SUPABASE_URL+path,{...opt,headers:{...h,...opt.headers}});let txt=await r.text();let d=txt?JSON.parse(txt):null;if(!r.ok)throw Error(d?.message||d?.error_description||d?.hint||txt||r.status);return d}
async function anon(){if(S.token)return;let d=await req('/auth/v1/signup',{method:'POST',body:'{}'});S.token=d.access_token;S.uid=d.user.id}
async function rpc(n,p){return req('/rest/v1/rpc/'+n,{method:'POST',body:JSON.stringify(p)})}
function row(x){return Array.isArray(x)?x[0]:x} function msg(x,e=false){el('status').textContent=x;el('status').className=e?'err':'ok'}
async function createRoom(){try{S.myName=el('name').value.trim()||'Host';await anon();let x=row(await rpc('ml_create_room',{p_name:S.myName,p_config:{mode:'online',rounds:1,questions_per_round:10,timer_seconds:45,joker_enabled:true,category_bans:true,chaos:false}}));S.room=x.room_id;S.code=x.room_code;S.host=true;ready()}catch(e){msg(e.message,true)}}
async function joinRoom(){try{S.myName=el('name').value.trim()||'Spieler';await anon();let c=el('code').value.trim().toUpperCase();let x=row(await rpc('ml_join_room',{p_code:c,p_name:S.myName}));S.room=x.room_id||x.id||x.room;S.code=c;S.host=false;if(!S.room){let z=await req('/rest/v1/rooms?code=eq.'+encodeURIComponent(c)+'&select=id');S.room=z[0]?.id}ready()}catch(e){msg(e.message,true)}}
function joinUrl(){let u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('join',S.code);return u.toString()}
function updateQr(){if(!S.code)return;const canvas=el('joinQr');if(window.QRCode&&canvas){QRCode.toCanvas(canvas,joinUrl(),{width:200,margin:1,errorCorrectionLevel:'M'},e=>{if(e)msg('QR-Code konnte nicht erzeugt werden',true)})}}
function applyJoinLink(){let c=new URL(location.href).searchParams.get('join');if(c){el('code').value=c.toUpperCase();msg('Raumcode aus QR übernommen ✓')}}
function ready(){if(S.t)clearInterval(S.t);saveSession();S.q=0;S.answeredQ=0;S.enteredGame=false;el('game').classList.add('preLobbyHidden');el('lobby').classList.add('preLobbyHidden');el('lobbyOverlay').classList.remove('hide');el('room').classList.add('hide');el('host').classList.toggle('hide',!S.host);el('overlayHost').classList.toggle('hide',!S.host);el('overlayCode').textContent=S.code;updateQr();el('roomcode').textContent='Raumcode: '+S.code;msg('Verbunden ✓');sync();S.t=setInterval(sync,1200)}
function closeLobby(){if(!S.q)return;el('lobbyOverlay').classList.add('hide')} async function copyCode(){try{await navigator.clipboard.writeText(S.code);msg('Raumcode kopiert ✓')}catch(e){}} async function team(n){try{await rpc('ml_set_team',{p_room:S.room,p_team:n});sync()}catch(e){msg(e.message,true)}}
async function sync(){if(!S.room)return;try{let ps=await req('/rest/v1/players?room_id=eq.'+S.room+'&select=*');let ts=await req('/rest/v1/online_team_members?room_id=eq.'+S.room+'&select=user_id,team_no');let tm=Object.fromEntries(ts.map(x=>[x.user_id,x.team_no]));const pname=p=>(p.user_id===S.uid&&S.myName)||p.display_name||p.player_name||p.nickname||p.username||p.name||'Spieler';S.playerNames=Object.fromEntries(ps.map(p=>[p.user_id,pname(p)]));el('players').innerHTML=ps.map(p=>'<div>'+pname(p)+' · '+(tm[p.user_id]?'Team '+tm[p.user_id]:'kein Team')+' · '+(p.score||0)+' P</div>').join('');el('playerCount').textContent='Spieler ('+ps.length+')';el('overlayPlayers').innerHTML=ps.map(p=>'<div class="playerRow"><span class="avatar">'+pname(p).charAt(0).toUpperCase()+'</span><div class="grow"><b>'+pname(p)+'</b>'+(p.user_id===S.uid?'<div class="hostTag">'+(S.host?'♛ Host · ':'')+'Du</div>':'')+'</div><span class="muted tiny">'+(tm[p.user_id]?'Team '+tm[p.user_id]:'bereit')+'</span></div>').join('')+(ps.length<2?'<div class="playerRow waiting">◌ &nbsp; Warte auf Spieler …</div>':'');el('teams').innerHTML=[1,2,3,4,5,6].map(n=>'<button onclick="team('+n+')">Team '+n+'</button>').join('');let q=await req('/rest/v1/online_ml_questions?room_id=eq.'+S.room+'&order=question_no.desc&limit=1&select=*');if(q[0]){const changed=q[0].question_no!==S.q;if(changed||!S.q){if(!S.enteredGame&&q[0].question_no===1)startTransition();showQ(q[0]);}S.q=q[0].question_no;if(S.q){let rr=await req('/rest/v1/online_ml_reveals?room_id=eq.'+S.room+'&question_no=eq.'+S.q+'&select=results');if(rr[0])showReveal(rr[0].results)}}}catch(e){msg('Sync: '+e.message,true)}}
const Q=[['Erde','Mars',12742,6779,'Durchmesser','km'],['Mount Everest','Zugspitze',8849,2962,'Höhe','m'],['Deutschland','Frankreich',357588,551695,'Fläche','km²'],['Nil','Rhein',6650,1233,'Länge','km'],['Jupiter','Erde',139820,12742,'Durchmesser','km'],['Pazifik','Atlantik',165250000,106460000,'Fläche','km²'],['Burj Khalifa','Eiffelturm',828,330,'Höhe','m'],['Amazonas','Donau',6400,2850,'Länge','km'],['Grönland','Island',2166086,103000,'Fläche','km²'],['Saturn','Neptun',116460,49244,'Durchmesser','km']];
function startTransition(){el('game').classList.add('preLobbyHidden');el('lobbyOverlay').classList.add('hide');el('gameEnter').classList.add('on')}
function endTransition(){setTimeout(()=>el('gameEnter').classList.remove('on'),1400)}
async function startQ(n){try{
 msg('Spiel wird gestartet …');startTransition();let z=Q[(n-1)%Q.length];
 const base={p_room:S.room,p_question_no:n,p_category:'Test',p_metric:z[4],p_prompt:'Was hat den höheren Wert?',p_unit:z[5],p_left_name:z[0],p_left_icon:'◀️',p_left_value:z[2],p_right_name:z[1],p_right_icon:'▶️',p_right_value:z[3],p_timer_seconds:45};
 let attempts=[
  base,
  {...base,p_timer:base.p_timer_seconds},
  {p_room:S.room,p_question_no:n,p_category:'Test',p_metric:z[4],p_prompt:'Was hat den höheren Wert?',p_unit:z[5],p_left_name:z[0],p_left_icon:'◀️',p_left_value:z[2],p_right_name:z[1],p_right_icon:'▶️',p_right_value:z[3]}
 ];
 let last;
 for(const a of attempts){try{await rpc('ml_online_ml_start',a);last=null;break}catch(e){last=e;if(!/function|schema cache|parameter|argument|PGRST/i.test(e.message))throw e}}
 if(last)throw last;
 msg('Spiel gestartet ✓');await sync();endTransition()
}catch(e){el('gameEnter').classList.remove('on');el('game').classList.add('preLobbyHidden');el('lobbyOverlay').classList.remove('hide');msg('Start: '+e.message,true);alert('Spielstart fehlgeschlagen: '+e.message)}}
function showQ(q){const first=S.q!==q.question_no;const same=S.q===q.question_no;S.q=q.question_no;if(!S.enteredGame){S.enteredGame=true;el('lobbyOverlay').classList.add('hide');el('game').classList.add('preLobbyHidden');el('gameEnter').classList.add('on');setTimeout(()=>{el('gameEnter').classList.remove('on');el('game').classList.remove('hide','preLobbyHidden')},1400)}else{el('lobbyOverlay').classList.add('hide');el('game').classList.remove('hide','preLobbyHidden')} el('prog').textContent='Frage '+q.question_no+'/10';el('prompt').textContent=q.prompt;el('an').textContent=q.left_name;el('bn').textContent=q.right_name;el('av').textContent=q.left_value+' '+q.unit;el('bv').textContent='???';const locked=S.answeredQ===q.question_no;el('a').disabled=locked;el('b').disabled=locked;el('reveal').textContent=locked?'🔒 Antwort gespeichert – warte auf die anderen.':'Wähle das Objekt mit dem höheren Wert.';if(!same||!locked)el('next').classList.add('hide')}
async function tryReveal(q){return}
async function answer(x){const q=S.q;if(!q||S.answeredQ===q)return;el('a').disabled=el('b').disabled=true;el('reveal').textContent='⏳ Antwort wird gespeichert …';try{await rpc('ml_online_ml_submit',{p_room:S.room,p_question_no:q,p_choice:x});S.answeredQ=q;el('reveal').textContent='🔒 Antwort gespeichert – warte auf die anderen.';await sync()}catch(e){if(S.q===q){el('a').disabled=false;el('b').disabled=false}el('reveal').textContent='Fehler: '+e.message}}
function showReveal(z){S.answeredQ=S.q;el('bv').textContent=z.right_value+' '+z.unit;el('reveal').innerHTML='<b>Richtig: '+z.correct_name+'</b><br>'+z.answers.map(x=>(x.name||S.playerNames[x.user_id]||'Spieler')+': '+(x.choice||'—')+' '+(x.correct?'✓':'')).join('<br>');el('a').disabled=el('b').disabled=true;if(S.host&&S.q<10)el('next').classList.remove('hide')}
async function restoreSession(){
 const x=loadSession(); if(!x?.token||!x?.room||!x?.code)return;
 S.reconnecting=true;Object.assign(S,x);
 try{
   let u=await req('/auth/v1/user');
   if(!u?.id)throw Error('Session abgelaufen');
   S.uid=u.id;
   let rooms=await req('/rest/v1/rooms?id=eq.'+encodeURIComponent(S.room)+'&select=id,code');
   if(!rooms[0])throw Error('Lobby existiert nicht mehr');
   S.code=rooms[0].code||S.code;
   ready();msg('Wieder verbunden ✓');
 }catch(e){clearSession();S.token=S.uid=S.room=S.code=null;S.host=false;msg('Rejoin nötig: '+e.message,true)}
 finally{S.reconnecting=false}
}
async function reconnect(){
 if(S.reconnecting||!S.room)return;
 S.reconnecting=true;
 try{await sync();msg('Wieder verbunden ✓')}catch(e){msg('Verbindung unterbrochen – Rejoin läuft …',true)}
 finally{S.reconnecting=false}
}
window.addEventListener('online',reconnect);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reconnect()});
window.addEventListener('pageshow',()=>{if(S.room)reconnect()});
window.addEventListener('error',e=>msg('JS: '+e.message,true));
applyJoinLink();restoreSession();
</script></body></html>
