name: Validate Game
on:
  push:
    branches: [Main, stronger-regression-tests]
  pull_request:
    branches: [Main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static game regression checks
        run: |
          node scripts/regression-check.mjs
      - name: Champions League draft content checks
        run: |
          python3 scripts/build-champions-league-draft-20261015.py --check
          node scripts/check-champions-league-draft-20261015.mjs
          npm run pwa:build
