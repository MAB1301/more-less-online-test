name: Validate Online Test
on:
  push:
    branches: [Main, dev/public-modes-questionpool]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify app
        run: |
          test -f index.html
          grep -q "ml_create_room" index.html
          grep -q "ml_online_ml_submit" index.html
          grep -q "onlineQuestion" index.html
          cmp -s index.html offline/index.html
