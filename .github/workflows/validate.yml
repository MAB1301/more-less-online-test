name: Validate Game
on:
  push:
    branches: [Main, stronger-regression-tests]
  pull_request:
    branches: [Main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static game regression checks
        run: |
          node scripts/regression-check.mjs
      - name: Review-only weather-extremes package
        run: |
          node scripts/inventory-weather-draft.mjs
          git diff --exit-code -- content/research/2026-10-09-weather-extremes/main-inventory.json
          python3 scripts/build-weather-draft.py --check
          node scripts/weather-draft-check.mjs
      - name: Offline build and regression
        run: |
          npm run pwa:build
          npm run test:pwa
