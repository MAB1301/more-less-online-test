name: Validate Game
on:
  push:
    branches: [Main, stronger-regression-tests]
  pull_request:
    branches: [Main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static game regression checks
        run: |
          node scripts/regression-check.mjs
          python3 scripts/build-records-extremes-guinness-draft-20261028.py --check
          node scripts/inventory-records-extremes-guinness-draft-20261028.mjs --check
          node scripts/check-records-extremes-guinness-draft-20261028.mjs
