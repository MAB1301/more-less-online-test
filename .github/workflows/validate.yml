name: Validate Game
on:
  push:
    branches: [Main, stronger-regression-tests]
  pull_request:
    branches: [Main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static game regression checks
        run: |
          node scripts/regression-check.mjs
      - name: Weltkultur foodways draft reproducibility and content checks
        run: |
          python3 scripts/build-weltkultur-foodways-draft-20261105.py --check
          node scripts/inventory-weltkultur-foodways-draft-20261105.mjs --check
          node scripts/check-weltkultur-foodways-draft-20261105.mjs
